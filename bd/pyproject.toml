[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-vectorizer"
version = "2.0.0"
description = "Конвертер документов в векторную базу с GPU"
requires-python = ">=3.9"
readme = "README.md"
dependencies = [
    "click>=8.1",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "PyYAML>=6.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "PyPDF2>=3.0",
    "pdf2image>=1.17",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "torch>=2.1",
    "sentence-transformers>=2.7",
    "faiss-cpu>=1.7",
]

[project.optional-dependencies]
gpu = ["faiss-gpu>=1.7.2"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
docvec = "src.main:cli"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
src = ["../config/*.yaml"]
